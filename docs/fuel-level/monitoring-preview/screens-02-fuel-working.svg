  <rect x="246" y="514" width="202" height="48" rx="12" fill="#152439" stroke="#293D54" stroke-width="1" />
  <text x="347.0" y="544.5" fill="#96ABC1" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="middle">Выключить</text>
  <text x="32" y="586" fill="#96ABC1" font-family="DejaVu Sans" font-size="14" font-weight="400" text-anchor="start">Управление не подключено</text>
  <rect x="32" y="599" width="416" height="44" rx="12" fill="#214258" />
  <text x="240.0" y="627.5" fill="#F1F6FC" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="middle">История температуры</text>
  <rect x="16" y="663" width="216" height="44" rx="12" fill="#214258" />
  <text x="124.0" y="691.5" fill="#F1F6FC" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="middle">Журнал</text>
  <rect x="248" y="663" width="216" height="44" rx="12" fill="#214258" />
  <text x="356.0" y="691.5" fill="#F1F6FC" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="middle">Диагностика</text>
  <rect x="16" y="719" width="448" height="44" rx="12" fill="#214258" />
  <text x="240.0" y="747.5" fill="#F1F6FC" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="middle">Назад</text>
  <text x="18" y="788" fill="#96ABC1" font-family="DejaVu Sans" font-size="14" font-weight="400" text-anchor="start">МАКЕТ · пример состояний</text>
