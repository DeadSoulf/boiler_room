<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-label="Топливо — верхний рабочий уровень">
  <title>Топливо — верхний рабочий уровень</title>
  <desc>Демонстрационный макет мониторинга. Нижний порог достигнут; верхний достигнут. Предусмотрен подогрев до 80 °C по сообщению пользователя. Температура и состояние подогрева неизвестны. Это не назначение аварийного предела или алгоритма управления.</desc>
  <rect x="0" y="0" width="480" height="800" rx="0" fill="#09121F" />
  <text x="18" y="48" fill="#F1F6FC" font-family="DejaVu Sans" font-size="26" font-weight="400" text-anchor="start">Топливо</text>
  <rect x="352" y="16" width="112" height="48" rx="12" fill="#214258" />
  <text x="408.0" y="46.5" fill="#F1F6FC" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="middle">Домой</text>
  <text x="18" y="104" fill="#96ABC1" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start">Уровень и подогрев топлива</text>
  <rect x="16" y="126" width="448" height="113" rx="18" fill="#152439" stroke="#62CFFF" stroke-width="1" />
  <text x="32" y="153" fill="#96ABC1" font-family="DejaVu Sans" font-size="14" font-weight="400" text-anchor="start">Уровень топлива</text>
  <text x="32" y="189" fill="#62CFFF" font-family="DejaVu Sans" font-size="25" font-weight="400" text-anchor="start">Верхний уровень достигнут</text>
  <text x="32" y="220" fill="#96ABC1" font-family="DejaVu Sans" font-size="14" font-weight="400" text-anchor="start">Оба порога подтверждены</text>
  <rect x="16" y="250" width="448" height="82" rx="18" fill="#152439" stroke="#293D54" stroke-width="1" />
  <circle cx="38" cy="278" r="5" fill="#62CFFF" />
  <text x="58" y="284" fill="#F1F6FC" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start">Верхний уровень</text>
  <text x="58" y="312" fill="#96ABC1" font-family="DejaVu Sans" font-size="14" font-weight="400" text-anchor="start">Герконовый датчик</text>
  <text x="446" y="285" fill="#62CFFF" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="end">Достигнут</text>
