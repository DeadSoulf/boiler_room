  <circle cx="38" cy="372" r="5" fill="#66DDB4" />
  <text x="58" y="378" fill="#F1F6FC" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start">Нижний уровень</text>
  <text x="58" y="406" fill="#96ABC1" font-family="DejaVu Sans" font-size="14" font-weight="400" text-anchor="start">Герконовый датчик</text>
  <text x="446" y="379" fill="#66DDB4" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="end">Достигнут</text>
  <rect x="16" y="440" width="448" height="192" rx="18" fill="#152439" stroke="#293D54" stroke-width="1" />
  <text x="32" y="470" fill="#F1F6FC" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start">Подогрев топлива</text>
