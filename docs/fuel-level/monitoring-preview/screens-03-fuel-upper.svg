  <text x="32" y="504" fill="#96ABC1" font-family="DejaVu Sans" font-size="14" font-weight="400" text-anchor="start">Температура</text>
  <text x="446" y="507" fill="#F1F6FC" font-family="DejaVu Sans" font-size="25" font-weight="400" text-anchor="end">--.- °C</text>
  <text x="32" y="539" fill="#96ABC1" font-family="DejaVu Sans" font-size="14" font-weight="400" text-anchor="start">Состояние</text>
  <text x="446" y="540" fill="#96ABC1" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="end">Нет данных</text>
