name: Pairing and web v0.9
on:
  push:
    paths: ['src/**', 'tests/**', 'VERSION', 'README*', 'CHANGELOG.md', 'scripts/check_release_version.py', '.github/workflows/pairing-web-safety.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'VERSION', 'README*', 'CHANGELOG.md', 'scripts/check_release_version.py', '.github/workflows/pairing-web-safety.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pairing-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Version and pairing state boundaries
        run: |
          python3 scripts/check_release_version.py
          python3 tests/pairing_static_tests.py
          python3 tests/home_assistant_tests.py
          python3 tests/storage_static_tests.py
          python3 tests/web_firmware_tests.py
          python3 tests/config_060_static.py
          python3 tests/sensors_static_tests.py
          python3 tests/flash_panel_tests.py
      - name: Browser dependencies (isolated fixture tests)
        run: |
          python3 -m pip install playwright==1.64.1
          python3 -m playwright install --with-deps chromium
      - name: Actual embedded page on desktop and mobile
        run: python3 tests/web_v090_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-v090-review
          path: artifacts/web-review/
          retention-days: 14
