name: v0.6.1 real sensor safety
on:
  push:
    paths:
      - 'src/**'
      - 'ci/prepare.py'
      - 'tests/sensors_static_tests.py'
      - 'tests/pin_profile_tests.cpp'
      - '.github/workflows/sensor-061-safety.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'ci/prepare.py'
      - 'tests/sensors_static_tests.py'
      - 'tests/pin_profile_tests.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-sensors:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: GPIO header map and conflicts
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/pin_profile_tests.cpp -o /tmp/pin_profile_test
          /tmp/pin_profile_test
      - name: Validate sensor pipeline, web API and NVS safety
        run: python3 tests/sensors_static_tests.py
      - name: Verify touch settings and configurable UI unchanged
        run: python3 tests/config_060_static.py
